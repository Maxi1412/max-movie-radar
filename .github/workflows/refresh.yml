name: Refresh movie catalog and publish PWA

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 5,17 * * *'

permissions:
  contents: write

concurrency:
  group: movie-radar-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Python catalog and episode tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate web application JavaScript
        run: |
          node --check app.js
          node --check tv.js
          node --check streaming.js
          node --check library.js
          node --check sw.js
      - name: Refresh movies and TV episodes from TMDb
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          python scripts/update_catalog.py
          python scripts/update_tv.py
          python scripts/update_streaming.py
      - name: Publish updated catalog to repository
        run: |
          if git diff --quiet -- data/releases.json data/tv.json data/streaming.json; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releases.json data/tv.json data/streaming.json
          git commit -m "Refresh movies, TV episodes and streaming availability"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish PWA to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
